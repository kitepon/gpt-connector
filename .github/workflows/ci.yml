name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 実行する工場環境
        type: choice
        default: all
        options: [all, macos-native, linux-native, windows-native, wsl2]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: product owns its CI contract
        shell: bash
        run: |
          test -f .github/workflows/product-full-ci.yml
          git grep -q 'uses: \.\/\.github\/workflows\/product-full-ci\.yml' -- .github/workflows
          owner_repo='kitepon/dotagents'
          if git grep -n "uses: $owner_repo/.github/workflows" -- .github/workflows; then
            echo '製品CIをdotagentsのworkflowへ委譲できません。' >&2
            exit 1
          fi
          if git grep -n -E 'uses:[[:space:]]+[^./][^[:space:]@]+@[^[:space:]#]+' -- .github/workflows |
            grep -Ev '@[0-9a-f]{40}([[:space:]]|#|$)'; then
            echo '外部actionは40桁のcommit SHAへ固定してください。' >&2
            exit 1
          fi

  full:
    # 製品側の検証契約を dotagents の将来変更から独立させる。
    uses: ./.github/workflows/product-full-ci.yml
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
      dependency-command: corepack pnpm install --frozen-lockfile
      documentation-command: >-
        corepack pnpm install --frozen-lockfile &&
        corepack pnpm exec tsx --test test/repository-contract.test.ts
      full-command: >-
        corepack pnpm check &&
        corepack pnpm build &&
        corepack pnpm test:release-gate

  publish:
    needs: [ownership, full]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@11.6.4
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify tag, package, and main ancestry
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          npm pack --dry-run --json >/dev/null
      - name: Publish to npm with provenance
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "gpt-connector@$version" version >/dev/null 2>&1; then
            echo "::notice::gpt-connector@$version は既にnpmに存在するためpublishをスキップします。"
            exit 0
          fi
          npm publish --provenance --access public
