  <text x="80" y="536" fill="#788d99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" letter-spacing=".5">A stable connector for agent-to-ChatGPT consultation</text>
  <rect x="80" y="566" width="1120" height="2" fill="url(#signal)" opacity=".7"/>
